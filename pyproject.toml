[project]
name = "delivery-lab"
version = "0.1.0"
description = "Лабораторная работа №1: тестирование расчёта доставки"
readme = "README.md"
requires-python = ">=3.11,<3.15"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8.3,<10",
    "pytest-cov>=6,<8",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--strict-config --strict-markers"

[tool.coverage.run]
branch = true
source = ["delivery"]

[tool.coverage.report]
show_missing = true
fail_under = 100
