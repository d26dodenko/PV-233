# Тот же граф блокировок, что в .github/workflows/ci.yml.
stages: [quality, build, integration, e2e, package]

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_OPEN_MERGE_REQUESTS'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "push"'
    - if: '$CI_PIPELINE_SOURCE == "web"'

variables:
  CARGO_TERM_COLOR: always
  GATE_DEMO: none # При Run pipeline: unit / coverage / security.

default:
  image: rust:1.100.0-bookworm
  interruptible: true

python:
  timeout: 20 minutes
  stage: quality
  image: ghcr.io/astral-sh/uv:0.11.30-python3.13-bookworm
  script:
    - uv sync --locked --dev
    - uv run --locked ruff check .
    - uv run --locked ruff format --check .
    - uv run --locked pytest -v --cov --cov-branch --cov-report=term-missing --cov-report=xml:artifacts/python/coverage.xml --cov-report=html:artifacts/python/html --junitxml=artifacts/python/junit.xml
    - |
      if [ "$GATE_DEMO" = unit ] || [ "$GATE_DEMO" = coverage ]; then
        uv run --locked python TestingPS/Laba-3/scripts/demo_gate.py "$GATE_DEMO"
      fi
  artifacts:
    when: always
    expire_in: 14 days
    paths: [artifacts/python]
    reports:
      junit: artifacts/python/junit.xml
      coverage_report:
        coverage_format: cobertura
        path: artifacts/python/coverage.xml

rust:
  timeout: 20 minutes
  stage: quality
  script:
    - rustup component add rustfmt clippy
    - cargo fmt --all --check
    - cargo clippy --locked --all-targets -- -D warnings
    - cargo test --locked --lib

security:
  timeout: 20 minutes
  stage: quality
  image: node:24-bookworm
  before_script:
    - curl --proto '=https' --tlsv1.2 -LsSf https://astral.sh/uv/0.11.30/install.sh -o /tmp/install-uv.sh
    - sh /tmp/install-uv.sh
    - export PATH="$HOME/.local/bin:$HOME/.cargo/bin:$PATH"
    - curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs -o /tmp/install-rust.sh
    - sh /tmp/install-rust.sh -y --profile minimal --default-toolchain 1.100.0
    - uv sync --locked --dev
  script:
    - mkdir -p artifacts/security
    - uv run --locked bandit -lll TestingPS/Laba-1/delivery.py Specification/Laba-1/calculator.py -f json -o artifacts/security/bandit.json
    - uv run --locked pip-audit --format json --output artifacts/security/pip-audit.json
    - npm ci
    - npm --prefix TestingPS/Laba-3/frontend ci
    - npm audit --audit-level=critical > artifacts/security/npm.txt
    - npm --prefix TestingPS/Laba-3/frontend audit --audit-level=critical > artifacts/security/frontend-npm.txt
    - cargo install cargo-audit --version 0.23.0 --locked
    - cargo audit --json > artifacts/security/cargo-audit.json
    - |
      if [ "$GATE_DEMO" = security ]; then
        uv run --locked python TestingPS/Laba-3/scripts/demo_gate.py security
      fi
  artifacts:
    when: always
    expire_in: 14 days
    paths: [artifacts/security]

build:
  timeout: 20 minutes
  stage: build
  image: node:24-bookworm
  needs: [python, rust, security]
  before_script:
    - curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs -o /tmp/install-rust.sh
    - sh /tmp/install-rust.sh -y --profile minimal --default-toolchain 1.100.0
    - export PATH="$HOME/.cargo/bin:$PATH"
  script:
    - npm ci
    - npm --prefix TestingPS/Laba-3/frontend ci
    - npm run typecheck
    - npm --prefix TestingPS/Laba-3/frontend run lint
    - npm --prefix TestingPS/Laba-3/frontend run build
    - cargo build --release --locked
  artifacts:
    expire_in: 7 days
    paths: [target/release/moroz-shop, TestingPS/Laba-3/frontend/dist]

integration:
  timeout: 20 minutes
  stage: integration
  needs: [build]
  script:
    - rustup component add llvm-tools-preview
    - cargo install cargo-llvm-cov --version 0.9.2 --locked
    - mkdir -p artifacts/rust
    - cargo llvm-cov --locked --all-targets --fail-under-lines 80 --lcov --output-path artifacts/rust/lcov.info
  after_script:
    - cargo llvm-cov report --cobertura --output-path artifacts/rust/cobertura.xml
    - cargo llvm-cov report --html --output-dir artifacts/rust/html
  artifacts:
    when: always
    expire_in: 14 days
    paths: [artifacts/rust]
    reports:
      coverage_report:
        coverage_format: cobertura
        path: artifacts/rust/cobertura.xml

e2e:
  timeout: 20 minutes
  stage: e2e
  image: mcr.microsoft.com/playwright:v1.56.1-noble
  needs:
    - job: build
      artifacts: true
    - job: integration
      artifacts: false
  variables:
    SHOP_EXECUTABLE: ./target/release/moroz-shop
  script:
    - npm ci
    - chmod +x target/release/moroz-shop
    - npm run test:e2e
  artifacts:
    when: always
    expire_in: 14 days
    paths: [artifacts/playwright, test-results]
    reports:
      junit: artifacts/playwright/junit.xml

package:
  timeout: 20 minutes
  stage: package
  needs:
    - job: build
      artifacts: true
    - job: e2e
      artifacts: false
  script:
    - chmod +x target/release/moroz-shop
    - tar -czf moroz-shop-linux-x64.tar.gz target/release/moroz-shop TestingPS/Laba-3/frontend/dist
  artifacts:
    expire_in: 14 days
    paths: [moroz-shop-linux-x64.tar.gz]

public-api:
  timeout: 20 minutes
  stage: quality
  image: node:24-bookworm
  # Явно включается переменной RUN_PUBLIC_API=1. Дефекты внешнего API дают failed pipeline.
  rules:
    - if: '$CI_PIPELINE_SOURCE == "web" && $RUN_PUBLIC_API == "1"'
  script:
    - npm ci
    - npm run test:api
  artifacts:
    when: always
    expire_in: 7 days
    paths: [artifacts/api]
    reports:
      junit: artifacts/api/junit.xml
